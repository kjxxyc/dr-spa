<svg width="28" height="20" viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="28" height="20" rx="3" fill="#C60B1E"/>
  <!-- Top red band -->
  <rect y="0" width="28" height="5" fill="#C60B1E"/>
  <!-- Yellow band -->
  <rect y="5" width="28" height="10" fill="#FFC400"/>
  <!-- Bottom red band -->
  <rect y="15" width="28" height="5" fill="#C60B1E"/>
  <!-- Coat of arms (simplified shield) -->
  <rect x="5" y="7" width="4" height="5" rx="0.5" fill="#C60B1E" stroke="#754B27" stroke-width="0.3"/>
  <rect x="5" y="7" width="2" height="2.5" fill="#C60B1E"/>
  <rect x="7" y="7" width="2" height="2.5" fill="#FFC400"/>
  <rect x="5" y="9.5" width="2" height="2.5" fill="#FFC400"/>
  <rect x="7" y="9.5" width="2" height="2.5" fill="#C60B1E"/>
  <!-- Crown -->
  <rect x="5.2" y="6" width="3.6" height="1.2" rx="0.3" fill="#FFC400"/>
  <circle cx="5.8" cy="5.8" r="0.4" fill="#FFC400"/>
  <circle cx="7" cy="5.6" r="0.4" fill="#FFC400"/>
  <circle cx="8.2" cy="5.8" r="0.4" fill="#FFC400"/>
  <!-- Pillars -->
  <rect x="3.5" y="7" width="0.8" height="5.5" rx="0.2" fill="#FFC400"/>
  <rect x="9.7" y="7" width="0.8" height="5.5" rx="0.2" fill="#FFC400"/>
</svg>