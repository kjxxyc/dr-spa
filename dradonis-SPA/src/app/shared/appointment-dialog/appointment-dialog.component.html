<div style="padding: 24px 32px; font-family: 'Inter', 'Roboto', sans-serif;">
  <h2 style="font-family: 'Montserrat', sans-serif; font-weight: 800; color: #112240; font-size: 24px; margin-top: 0; margin-bottom: 16px; text-transform: uppercase; text-align: center;">
    {{ 'appointmentModal.title' | translate }}
  </h2>
  
  <p style="color: #4A5568; font-size: 15px; margin-bottom: 24px; line-height: 1.5;" [innerHTML]="'appointmentModal.subtitle' | translate"></p>

  <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
    <!-- Row 1: Full Name & Phone Number -->
    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
      <div style="flex: 1;">
        <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 13px; color: #334155;">
          {{ 'appointmentModal.fullName' | translate }} <span style="color: #ef4444;">*</span>
        </label>
        <div style="position: relative;">
          <mat-icon style="position: absolute; left: 12px; top: 12px; color: #94a3b8; font-size: 20px; width: 20px; height: 20px;">person_outline</mat-icon>
          <input type="text" formControlName="fullName" style="width: 100%; padding: 12px 12px 12px 40px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; color: #334155; box-sizing: border-box; outline: none; transition: border-color 0.2s;" [placeholder]="'John Smith'" onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#cbd5e1'">
        </div>
        <div *ngIf="appointmentForm.get('fullName')?.touched && appointmentForm.get('fullName')?.invalid" style="color: #ef4444; font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 4px;">
          <mat-icon style="font-size: 14px; width: 14px; height: 14px;">error_outline</mat-icon> Required field.
        </div>
      </div>
      <div style="flex: 1;">
        <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 13px; color: #334155;">
          {{ 'appointmentModal.phone' | translate }} <span style="color: #ef4444;">*</span>
        </label>
        <div style="position: relative;">
          <mat-icon style="position: absolute; left: 12px; top: 12px; color: #94a3b8; font-size: 20px; width: 20px; height: 20px;">phone</mat-icon>
          <input type="tel" formControlName="phone" (input)="onPhoneInput($event)" style="width: 100%; padding: 12px 12px 12px 40px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; color: #334155; box-sizing: border-box; outline: none; transition: border-color 0.2s;" placeholder="(305) 555-0123" onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#cbd5e1'">
        </div>
        <div *ngIf="appointmentForm.get('phone')?.touched && appointmentForm.get('phone')?.invalid" style="color: #ef4444; font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 4px;">
          <mat-icon style="font-size: 14px; width: 14px; height: 14px;">error_outline</mat-icon> Required field.
        </div>
      </div>
    </div>

    <!-- Row 2: Email -->
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 13px; color: #334155;">
        {{ 'appointmentModal.email' | translate }} <span style="color: #ef4444;">*</span>
      </label>
      <div style="position: relative;">
        <mat-icon style="position: absolute; left: 12px; top: 12px; color: #94a3b8; font-size: 20px; width: 20px; height: 20px;">mail_outline</mat-icon>
        <input type="email" formControlName="email" style="width: 100%; padding: 12px 12px 12px 40px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; color: #334155; box-sizing: border-box; outline: none; transition: border-color 0.2s;" placeholder="john@example.com" onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#cbd5e1'">
      </div>
      <div *ngIf="appointmentForm.get('email')?.touched && appointmentForm.get('email')?.invalid" style="color: #ef4444; font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 4px;">
        <mat-icon style="font-size: 14px; width: 14px; height: 14px;">error_outline</mat-icon> Valid email is required.
      </div>
    </div>

    <!-- Row 3: Reason for Appointment -->
    <div style="margin-bottom: 24px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 13px; color: #334155;">
        {{ 'appointmentModal.reason' | translate }} <span style="color: #ef4444;">*</span>
      </label>
      <textarea formControlName="reason" rows="2" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; color: #334155; box-sizing: border-box; resize: vertical; outline: none; transition: border-color 0.2s;" placeholder="Briefly describe what you need help with..." onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#cbd5e1'"></textarea>
      <div *ngIf="appointmentForm.get('reason')?.touched && appointmentForm.get('reason')?.invalid" style="color: #ef4444; font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 4px;">
        <mat-icon style="font-size: 14px; width: 14px; height: 14px;">error_outline</mat-icon> Please provide a reason for the appointment.
      </div>
    </div>

    <!-- Submit Button -->
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
      <div style="display: flex; align-items: center; gap: 6px; min-width: 0;">
        <mat-icon style="color: #3b82f6; font-size: 18px; width: 18px; height: 18px;">info</mat-icon>
        <span style="color: #64748b; font-size: 13px; font-weight: 500;">
          {{ 'appointmentModal.requiredMsg' | translate }}
        </span>
      </div>
      <div style="display: flex; gap: 12px;">
        <button type="button" (click)="onCancel()" style="background-color: #fb977d; color: #FFF; border: none; border-radius: 50px; padding: 12px 24px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background-color 0.2s; display: flex; justify-content: center; align-items: center;" onmouseover="this.style.backgroundColor='#f08267'" onmouseout="this.style.backgroundColor='#fb977d'">
          {{ 'appointmentModal.cancel' | translate }}
        </button>
        <button type="submit" [disabled]="isSubmitting" style="background-color: #005eb8; color: #FFF; border: none; border-radius: 50px; padding: 12px 32px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background-color 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;" onmouseover="this.style.backgroundColor='#024d96'" onmouseout="this.style.backgroundColor='#005eb8'">
          {{ isSubmitting ? ('appointmentModal.sending' | translate) : ('appointmentModal.submit' | translate) }}
        </button>
      </div>
    </div>
  </form>
</div>
