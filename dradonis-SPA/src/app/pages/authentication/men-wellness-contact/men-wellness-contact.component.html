<div class="blank-layout-container justify-content-center tadalafil-eval">
  <div class="position-relative w-100" style="max-width: 860px; margin: 0 auto; padding: 2rem 1rem;">

    <!-- Header: top bar (language + logo) -->
    <div class="d-flex align-items-center justify-content-between m-b-16">
      <button mat-icon-button (click)="toggleLanguage()" class="lang-toggle-btn"
        style="border: 1px solid #e0e0e0; border-radius: 8px; padding: 4px 12px; width: auto; height: 36px;">
        <div class="d-flex align-items-center" style="gap: 6px;">
          <img [src]="otherFlagIcon" width="22" height="16" alt="flag" style="border-radius: 2px;" />
          <span class="f-s-12 f-w-600">{{ t('langToggle') }}</span>
        </div>
      </button>
      <a href="https://dradonis.com" target="_blank">
        <picture>
          <source srcset="/assets/images/logos/Logo_500x133.webp" type="image/webp">
          <img src="/assets/images/logos/Logo_500x133.png" alt="Dr. Adonis" class="form-logo" width="125" height="33" />
        </picture>
      </a>
    </div>

    <!-- Banner Image -->
    <div class="m-b-16">
      <img [src]="bannerImage" [alt]="'Limitless Vitality and Energy'" class="banner-img" />
    </div>

    <!-- Landing Card -->
    <div class="landing-hero-card">

      <!-- Title -->
      <h1 class="landing-hero-title">{{ t('heroTitle') }}</h1>

      <!-- Subtitle -->
      <p class="landing-hero-subtitle">{{ t('heroSubtitle') }}</p>

      <!-- Benefits -->
      <ul class="landing-benefits">
        <li>
          <span class="benefit-emoji">💼</span>
          <span>{{ t('benefit1') }}</span>
        </li>
        <li>
          <span class="benefit-emoji">🚫</span>
          <span>{{ t('benefit2') }}</span>
        </li>
        <li>
          <span class="benefit-emoji">📦</span>
          <span>{{ t('benefit3') }}</span>
        </li>
      </ul>

      <!-- CTA Button -->
      <button class="landing-cta-btn" (click)="onStartConsultation()">
        <mat-icon>arrow_forward</mat-icon>
        <span>{{ t('ctaButton') }}</span>
      </button>

      <!-- Time estimate -->
      <p class="landing-time-note">
        <mat-icon>schedule</mat-icon>
        {{ t('timeEstimate') }}
      </p>

      <!-- Security Notice -->
      <div class="security-notice">
        <mat-icon>lock</mat-icon>
        <p>{{ t('securityMessage') }}</p>
      </div>

    </div>

  </div>
</div>
