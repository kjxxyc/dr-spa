<div class="contact-page">
  <div class="contact-header-section">
    <div class="contact-container">
      <h1 class="contact-main-title">
        <mat-icon>mail_outline</mat-icon>
        <span>{{ 'header.nav.contact' | translate }}</span>
      </h1>
      <p class="contact-main-subtitle" [innerHTML]="'appointmentModal.subtitle' | translate"></p>
    </div>
  </div>

  <div class="contact-container contact-content-grid">
    <!-- Contact Info Sidebar -->
    <div class="contact-info-card">
      <div class="info-item">
        <div class="info-icon">
          <mat-icon>phone</mat-icon>
        </div>
        <div class="info-text">
          <h3>Phone</h3>
          <a href="tel:+13052047816">(305) 204-7816</a>
        </div>
      </div>

      <div class="info-item">
        <div class="info-icon">
          <mat-icon>location_on</mat-icon>
        </div>
        <div class="info-text">
          <h3>Location</h3>
          <p>Miami, Florida, US</p>
        </div>
      </div>

      <div class="info-item">
        <div class="info-icon">
          <mat-icon>videocam</mat-icon>
        </div>
        <div class="info-text">
          <h3>Telemedicine</h3>
          <p>Available worldwide via video & phone</p>
        </div>
      </div>

      <div class="info-item">
        <div class="info-icon">
          <mat-icon>schedule</mat-icon>
        </div>
        <div class="info-text">
          <h3>Hours</h3>
          <p>Monday – Friday: 9:00 AM – 5:00 PM</p>
        </div>
      </div>
    </div>

    <!-- Embedded Form Card -->
    <div class="contact-form-wrapper">
      <iframe
        [src]="formUrl"
        style="width:100%;height:100%;min-height:750px;border:none;border-radius:8px"
        id="inline-ISdbjfvFOOPm2YQArfiL"
        data-layout="{'id':'INLINE'}"
        data-trigger-type="alwaysShow"
        data-trigger-value=""
        data-activation-type="alwaysActivated"
        data-activation-value=""
        data-deactivation-type="neverDeactivate"
        data-deactivation-value=""
        data-form-name="Website Appt Request Form - A2P"
        data-height="1207"
        data-layout-iframe-id="inline-ISdbjfvFOOPm2YQArfiL"
        data-form-id="ISdbjfvFOOPm2YQArfiL"
        title="Website Appt Request Form - A2P">
      </iframe>
    </div>
  </div>
</div>
