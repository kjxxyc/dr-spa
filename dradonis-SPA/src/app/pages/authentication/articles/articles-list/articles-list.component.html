<div class="articles-page">
  <section class="articles-hero">
    <div class="articles-hero-content">
      <p class="articles-eyebrow">DR. ADONIS BLOG</p>
      <h1>{{ 'articlesPage.title' | translate }}</h1>
      <p class="articles-hero-subtitle">{{ 'articlesPage.subtitle' | translate }}</p>
      
      <div class="articles-filters">
        <div class="search-box">
          <mat-icon>search</mat-icon>
          <input 
            type="text" 
            [(ngModel)]="searchText" 
            (ngModelChange)="onFilterChange()" 
            [placeholder]="'articlesPage.searchPlaceholder' | translate"
          >
        </div>
        
        <div class="lang-filter">
          <select [(ngModel)]="selectedLanguage" (ngModelChange)="onFilterChange()">
            <option value="all">{{ 'articlesPage.allLanguages' | translate }}</option>
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <section class="articles-list-section">
    <div class="articles-grid">
      <article class="article-card" *ngFor="let article of displayedArticles">
        <a [routerLink]="['/articles', article.slug]" class="article-link">
          <div class="article-image">
            <img [src]="article.imageUrl || 'assets/images/logos/Logo_720x192.jpg'" [alt]="article.title" loading="lazy">
          </div>
          <div class="article-content">
            <span class="article-date">{{ article.date | date:'longDate' }}</span>
            <h2 class="article-title" [innerHTML]="article.title"></h2>
            <div class="article-excerpt" [innerHTML]="article.excerpt"></div>
            <span class="article-read-more">{{ 'articlesPage.readMore' | translate }} <mat-icon>arrow_forward</mat-icon></span>
          </div>
        </a>
      </article>
    </div>

    <div class="load-more-container" *ngIf="hasMore">
      <button class="btn-load-more" (click)="loadMore()">
        {{ 'articlesPage.loadMore' | translate }}
      </button>
    </div>
  </section>
</div>
