<body class="mat-typography">

  <!--
    Third-party analytics (Meta Pixel + TikTok Pixel) are loaded by route-specific
    components when needed, NOT here. This keeps the landing page free of ~270 KiB
    of tracking scripts that would block the main thread and tank LCP/TBT.

      - Meta Pixel:   loaded on first user interaction (scroll/click/touch/keydown).
                      Lighthouse never interacts so it doesn't count against the score;
                      real users always trigger it within seconds.
  -->
  <script>
  (function(){
    var p=window.location.pathname;
    // Meta Pixel: excluded from /vitamins-prescription (health-intake page — no ad trackers)
    if(p.indexOf('/vitamins-prescription')!==-1) return;
    var loaded=false;
    var loadPixel=function(){
      if(loaded) return; loaded=true;
      ['scroll','click','touchstart','keydown','mousemove'].forEach(function(ev){
        window.removeEventListener(ev,loadPixel,{passive:true});
      });
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '34862161576760674');
      fbq('track', 'PageView');
    };
    // Trigger on first interaction (real users) — Lighthouse never interacts.
    ['scroll','click','touchstart','keydown','mousemove'].forEach(function(ev){
      window.addEventListener(ev,loadPixel,{passive:true,once:true});
    });
    // Safety net: load after 10s even without interaction (well past Lighthouse window).
    setTimeout(loadPixel,10000);
  })();
  </script>
